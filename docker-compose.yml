version: "3.8"

services:
  app:
    container_name: eticaret-app
    build: .
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://mark:my.passwd@postgres:5432/CoreDB?schema=public"
      NEXTAUTH_SECRET: "gizli-sifre-123"
      AUTH_SECRET: "gizli-sifre-123"
      NEXTAUTH_URL: "http://localhost:3000"
    # --- İŞTE BU KISMI DÜZELTİYORUZ ---
    volumes:
      - .:/app
      - /app/node_modules
      - ./.next:/app/.next
      - ./public/uploads:/app/public/uploads

  postgres:
    image: postgres:15
    container_name: eticaret-db
    restart: always
    environment:
      POSTGRES_USER: mark
      POSTGRES_PASSWORD: my.passwd
      POSTGRES_DB: CoreDB
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
